name: Storage Concurrency Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/storage/storage-concurrency.*'
      - 'benchmarks/storage/providers.ts'
      - 'benchmarks/src/util/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  schedule:
    - cron: '0 13 * * 3' # Weekly on Wednesday at 13:00 UTC
  workflow_dispatch:
    inputs:
      operations:
        description: 'GET operations per concurrency cell'
        required: false
        default: '1200'
        type: string

concurrency:
  group: storage-concurrency-benchmarks
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    name: Compare storage providers
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    # runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: namespacelabs/nscloud-setup@df198f982fcecfb8264bea3f1274b56a61b6dfdc # v0.0.12
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run storage concurrency benchmark
        env:
          STORAGE_CONCURRENCY_OPERATIONS: ${{ inputs.operations || '1200' }}
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_REGION|S3_BUCKET|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|R2_BUCKET|R2_ACCOUNT_ID|TIGRIS_STORAGE_ACCESS_KEY_ID|TIGRIS_STORAGE_SECRET_ACCESS_KEY|TIGRIS_STORAGE_BUCKET|BLOB_READ_WRITE_TOKEN|VERCEL_BLOB_BUCKET|GCS_PROJECT_ID|GCS_BUCKET|GCS_CLIENT_EMAIL|GCS_PRIVATE_KEY|AZURE_ACCOUNT_NAME|AZURE_ACCOUNT_KEY|AZURE_CONTAINER|TENSORLAKE_API_KEY|TENSORLAKE_API_URL|TENSORLAKE_ORGANIZATION_ID|TENSORLAKE_PROJECT_ID|TENSORLAKE_FILESYSTEM|ARCHIL_S3_ACCESS_KEY_ID|ARCHIL_S3_SECRET_ACCESS_KEY|ARCHIL_BUCKET|ARCHIL_REGION|ARCHIL_BRANCH|NEON_BUCKET|NEON_ENDPOINT|NEON_ACCESS_KEY_ID|NEON_SECRET_ACCESS_KEY|NEON_REGION|BENCHMARKS_PLATFORM_API_KEY)'
          pnpm bench:storage-concurrency
