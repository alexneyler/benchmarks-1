name: HPC Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'benchmarks/hpc/**'
      - 'benchmarks/scripts/hpc-smoke.ts'
      - 'benchmarks/scripts/build-hpc-bundles.ts'
      - 'benchmarks/scripts/ensure-hpc-bundle.ts'
      - 'benchmarks/src/run.ts'
      - 'benchmarks/scripts/load-vault-secrets.sh'
      - 'package.json'
      - '.github/workflows/bench-hpc.yml'
  schedule:
    # Weekly Friday at midnight UTC. The matrix below fans out across every
    # ComputeSDK-equipped sandbox provider (~23 active entries), so we run
    # weekly rather than daily to keep wall-time and GPU/CPU minute costs
    # within the namespace budget.
    - cron: '0 0 * * 5'
  workflow_dispatch:
    inputs:
      replicas:
        description: 'Replicates per (provider, suite). Dev signal is fine at R=1-3; bump to 5+ for production-grade mean.'
        required: false
        default: '3'
      provider:
        description: 'Comma-separated provider filter (e2b,daytona,modal). Leave empty for the full 23-provider matrix.'
        required: false
        default: ''
      suite_id:
        description: 'Comma-separated suite filter (cpu-node,memory,disk,...). Leave empty for all 11 suites.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - cpu-node
          - memory
          - disk
          - network-localhost
          - network-wan
          - system
          - pgbench
          - realworld
          - latency
          - dns
          - download
      dry_run:
        description: 'Run without ingesting or committing results'
        required: false
        default: false
        type: boolean

concurrency:
  group: hpc-benchmarks
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

# Matrix fans out (provider x suite_id). The full provider list mirrors the
# active set in sandbox-tti-benchmarks.yml; commented entries are intentionally
# omitted because the corresponding ComputeSDK adapter isn't wired yet.
jobs:
  matrix:
    name: HPC ${{ matrix.provider }} ${{ matrix.suite_id }}
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    timeout-minutes: 30 # cpu-node + realworld + pgbench at R=3 stay under 5 min; 30 min buffer for slower regional sandboxes.
    strategy:
      fail-fast: false
      matrix:
        provider:
          - archil
          - beam
          - blaxel
          - cloud-run
          - cloudflare
          - codesandbox
          - createos
          - daytona
          - declaw
          - e2b
          - hopx
          - isorun
          - lightning
          - modal
          - northflank
          - opencomputer
          - runloop
          - sandbox0
          - superserve
          - tenki
          - tensorlake
          - upstash
          - vercel
        suite_id:
          - cpu-node
          - memory
          - disk
          - network-localhost
          - network-wan
          - system
          - pgbench
          - realworld
          - latency
          - dns
          - download
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        if: |
          github.event_name != 'workflow_dispatch' ||
          (github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider))) &&
          (github.event.inputs.suite_id == '' || contains(format(',{0},', github.event.inputs.suite_id), format(',{0},', matrix.suite_id)))
        run: |
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            pnpm update
          else
            pnpm install --frozen-lockfile
          fi
      - name: Build HPC bundles
        if: |
          github.event_name != 'workflow_dispatch' ||
          (github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider))) &&
          (github.event.inputs.suite_id == '' || contains(format(',{0},', github.event.inputs.suite_id), format(',{0},', matrix.suite_id)))
        run: pnpm run build:hpc-bundles
      - name: Clear stale results from checkout
        if: |
          github.event_name != 'workflow_dispatch' ||
          (github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider))) &&
          (github.event.inputs.suite_id == '' || contains(format(',{0},', github.event.inputs.suite_id), format(',{0},', matrix.suite_id)))
        run: rm -rf results/
      - name: Run HPC benchmark
        # Vault is loaded with the same wide KEYS regex used by
        # sandbox-tti-benchmarks.yml: each cell exports only the secrets
        # that exist in the vault. Missing keys are simply absent, so an
        # unwired provider doesn't fail the load step; the orchestrator
        # downstream surfaces a `reason: missing-key` if a credential
        # is actually needed.
        if: |
          github.event_name != 'workflow_dispatch' ||
          (github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider))) &&
          (github.event.inputs.suite_id == '' || contains(format(',{0},', github.event.inputs.suite_id), format(',{0},', matrix.suite_id)))
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(ARCHIL_API_KEY|ARCHIL_REGION|ARCHIL_DISK_ID|BEAM_TOKEN|BEAM_WORKSPACE_ID|BL_API_KEY|BL_WORKSPACE|CLOUD_RUN_SANDBOX_URL|CLOUD_RUN_SANDBOX_SECRET|CLOUDFLARE_SANDBOX_URL|CLOUDFLARE_SANDBOX_SECRET|CSB_API_KEY|CREATEOS_SANDBOX_API_KEY|DAYTONA_API_KEY|DECLAW_API_KEY|E2B_API_KEY|HOPX_API_KEY|ISORUN_API_KEY|LIGHTNING_API_KEY|MODAL_TOKEN_ID|MODAL_TOKEN_SECRET|NSC_TOKEN|NORTHFLANK_TOKEN|NORTHFLANK_PROJECT_ID|OPENCOMPUTER_API_KEY|OPENCOMPUTER_API_URL|RUNLOOP_API_KEY|SANDBOX0_TOKEN|SPRITES_TOKEN|SUPERSERVE_API_KEY|TENKI_API_KEY|TENSORLAKE_API_KEY|UPSTASH_BOX_API_KEY|VERCEL_TOKEN|VERCEL_TEAM_ID|VERCEL_PROJECT_ID)'

          pnpm run bench -- \
            --provider ${{ matrix.provider }} \
            --mode hpc-${{ matrix.suite_id }} \
            --hpc-replicas ${{ github.event.inputs.replicas || '3' }}
      - name: Upload results
        if: |
          always() && (
            github.event_name != 'workflow_dispatch' ||
            ((github.event.inputs.provider == '' || contains(format(',{0},', github.event.inputs.provider), format(',{0},', matrix.provider))) &&
             (github.event.inputs.suite_id == '' || contains(format(',{0},', github.event.inputs.suite_id), format(',{0},', matrix.suite_id))))
          )
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.provider }}-hpc-${{ matrix.suite_id }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  collect:
    name: Collect HPC Results
    runs-on: namespace-profile-default;permissions.additional_grant=vault/object:*:list;permissions.additional_grant=vault/object:*:describe
    needs: matrix
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase-on-push retry below has a merge base.
          # A shallow (depth-1) clone can make `git rebase origin/<branch>`
          # fail when the remote has advanced past the shallow boundary.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: |
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            pnpm update
          else
            pnpm install --frozen-lockfile
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: results-*
      - name: Merge per-provider results into combined per-suite files
        run: npx tsx benchmarks/src/merge-results.ts --input artifacts --mode hpc
      - name: Generate SVG leaderboard + per-suite charts
        run: pnpm run generate-hpc-svg
      - name: Upload SVGs as artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: hpc-benchmark-svgs
          path: 'hpc_*.svg'
          if-no-files-found: ignore
          retention-days: 7
      - name: Ingest results to platform
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        continue-on-error: true  # ingest is best-effort (see the ingest step); don't fail the job if secrets aren't seeded yet
        run: |
          . benchmarks/scripts/load-vault-secrets.sh '^(INGEST_URL|INGEST_SECRET)'
          npx tsx benchmarks/src/ingest.ts --type hpc
      - name: Post results to merged PR
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const resultsDir = 'results';
            const suiteDirs = fs.readdirSync(resultsDir)
              .filter(d => d.startsWith('hpc_') && fs.existsSync(path.join(resultsDir, d, 'latest.json')))
              .sort();

            let body = '## HPC Benchmark Results\n\n';
            let hasResults = false;

            for (const suiteDir of suiteDirs) {
              const latestPath = path.join(resultsDir, suiteDir, 'latest.json');
              const data = JSON.parse(fs.readFileSync(latestPath, 'utf-8'));
              const results = (data.results || [])
                .filter(r => !r.skipped)
                .sort((a, b) => (b.compositeScore || 0) - (a.compositeScore || 0));
              if (results.length === 0) continue;
              hasResults = true;

              const suite = suiteDir.replace(/^hpc_/, '').replace(/_/g, '-');
              body += `### ${suite}\n\n`;
              body += '| # | Provider | Score | Median | Unit | Status |\n';
              body += '|---|----------|------:|-------:|------|--------|\n';
              results.forEach((r, i) => {
                const score = r.compositeScore !== undefined ? r.compositeScore.toFixed(1) : '--';
                const value = r.metric && r.metric.value != null
                  ? (r.metric.unit === 'mb_per_s' ? r.metric.value.toFixed(1)
                    : r.metric.unit === 'gb_per_s' ? r.metric.value.toFixed(2)
                    : r.metric.value.toFixed(1)) : '--';
                const unit = (r.metric && r.metric.unit) || '';
                const ok = (r.iterations || []).filter(it => !it.error).length;
                const total = (r.iterations || []).length;
                body += `| ${i + 1} | ${r.provider} | ${score} | ${value} | ${unit} | ${ok}/${total} |\n`;
              });
              body += '\n';
            }

            // Cross-provider leaderboard summary
            const summary = {};
            for (const suiteDir of suiteDirs) {
              const data = JSON.parse(fs.readFileSync(path.join(resultsDir, suiteDir, 'latest.json'), 'utf-8'));
              for (const r of (data.results || [])) {
                if (r.skipped) continue;
                if (!summary[r.provider]) summary[r.provider] = { total: 0, count: 0 };
                summary[r.provider].total += (r.compositeScore || 0);
                summary[r.provider].count += 1;
              }
            }
            const summaryRows = Object.entries(summary).sort((a, b) => (b[1].total / b[1].count) - (a[1].total / a[1].count));
            if (summaryRows.length > 0) {
              body += '### Mean composite\n\n';
              body += '| # | Provider | Mean | n |\n';
              body += '|---|----------|-----:|--:|\n';
              summaryRows.forEach(([provider, agg], i) => {
                body += `| ${i + 1} | ${provider} | ${(agg.total / agg.count).toFixed(1)} | ${agg.count} |\n`;
              });
              body += '\n';
            }

            if (!hasResults) {
              body += '> No HPC benchmark results were generated.\n\n';
            }
            body += `---\n*[View full run](${runUrl}) · SVGs available as [build artifacts](${runUrl}#artifacts)*`;

            const target = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = prs.find(p => p.merged_at && p.base.ref === target);
            if (!pr) {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body,
              });
              return;
            }

            const marker = '## HPC Benchmark Results';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
      - name: Commit and push
        if: github.event_name != 'push' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ hpc_*.svg
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update HPC benchmark results [skip ci]"

          branch="${GITHUB_REF#refs/heads/}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${branch}"
            git rebase "origin/${branch}" || { git rebase --abort; exit 1; }
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); will rebase and retry"
          done
          echo "Failed to push after multiple attempts" >&2
          exit 1
